<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f0f1a" />
    <meta name="description" content="درب - سكرتير خاص فيك" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="درب" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>درب - سكرتير خاص فيك</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-primary: #0f0f1a;
        --bg-secondary: #1a1a2e;
        --bg-tertiary: #16213e;
        --bg-card: linear-gradient(135deg, rgba(26,26,46,0.95), rgba(22,33,62,0.95));
        --bg-card-alt: linear-gradient(135deg, rgba(26,26,46,0.9), rgba(22,33,62,0.9));
        --text-primary: #eee;
        --text-secondary: #888;
        --text-muted: #666;
        --accent: #e94560;
        --accent-hover: #c23152;
        --accent-glow: rgba(233,69,96,0.3);
        --border: rgba(255,255,255,0.1);
        --border-accent: rgba(233,69,96,0.15);
        --input-bg: rgba(255,255,255,0.05);
        --shadow: rgba(0,0,0,0.3);
        --success: #2ecc71;
        --warning: #f39c12;
        --info: #3498db;
        --danger: #e94560;
        --scrollbar-track: #1a1a2e;
        --scrollbar-thumb: #e94560;
      }
      [data-theme="light"] {
        --bg-primary: #f5f5fa;
        --bg-secondary: #ffffff;
        --bg-tertiary: #f0f0f5;
        --bg-card: linear-gradient(135deg, #ffffff, #f8f8ff);
        --bg-card-alt: linear-gradient(135deg, #ffffff, #f8f8ff);
        --text-primary: #1a1a2e;
        --text-secondary: #666;
        --text-muted: #999;
        --accent: #e94560;
        --accent-hover: #c23152;
        --accent-glow: rgba(233,69,96,0.2);
        --border: rgba(0,0,0,0.1);
        --border-accent: rgba(233,69,96,0.2);
        --input-bg: rgba(0,0,0,0.03);
        --shadow: rgba(0,0,0,0.1);
        --scrollbar-track: #e0e0e8;
        --scrollbar-thumb: #e94560;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Cairo', 'Segoe UI', sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        overflow-x: hidden;
        transition: background 0.3s, color 0.3s;
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
      ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
      input, textarea, select, button { font-family: 'Cairo', sans-serif; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
      .fade-in { animation: fadeIn 0.3s ease-out; }
      .slide-in { animation: slideIn 0.3s ease-out; }
      input, select, textarea { transition: all 0.2s; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
